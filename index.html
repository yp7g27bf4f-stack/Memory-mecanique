<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Memory mécanique automobile</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box} body{margin:0;background:#eef2f5;color:#17212b}
header{padding:16px 12px 8px;text-align:center;position:sticky;top:0;background:#eef2f5ee;backdrop-filter:blur(10px);z-index:5}
h1{font-size:24px;margin:0 0 4px} .hint{margin:0;color:#64717c;font-size:14px}
.stats{display:flex;justify-content:center;gap:15px;align-items:center;margin:10px 0;flex-wrap:wrap;font-weight:700}
button{font:inherit} #new{border:0;border-radius:10px;background:#1e2c38;color:#fff;padding:9px 13px;font-weight:700}
#board{width:min(900px,96vw);margin:6px auto 25px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.card{border:0;background:none;padding:0;aspect-ratio:1/1;perspective:900px;touch-action:manipulation}
.inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .3s}
.card.open .inner,.card.done .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:13px;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px #0002}
.back{background:#243442;border:2px solid #566a79;color:#e6edf2;font-size:32px}
.front{background:#fff;transform:rotateY(180deg);padding:5px}
.front img{width:100%;height:100%;object-fit:cover}
.name{font-size:clamp(12px,2vw,18px);font-weight:800;text-align:center;padding:6px}
.card.done .face{box-shadow:0 0 0 3px #49a56b}
#win{display:none;text-align:center;font-size:20px;font-weight:800;padding:5px 15px 28px}
#sources{font-size:11px;color:#7b8791;text-align:center;padding:0 12px 25px}
@media(max-width:650px){#board{grid-template-columns:repeat(4,1fr);gap:7px}}
@media(max-width:430px){#board{grid-template-columns:repeat(3,1fr);gap:6px}}
</style>
</head>
<body>
<header>
<h1>🔧 Memory mécanique</h1>
<p class="hint">Trouve le nom correspondant à la photo réelle de la pièce.</p>
<div class="stats"><span>Coups <b id="moves">0</b></span><span>Paires <b id="found">0</b>/15</span><button id="new">Nouvelle partie</button></div>
</header>
<div id="board"></div>
<div id="win">🎉 Bravo ! Toutes les paires sont trouvées.</div>
<div id="sources">Photos provenant de Wikimedia Commons. Les crédits/licences sont consultables en ouvrant les fichiers originaux.</div>
<script>
const parts=[{"name": "Alternateur", "file": "Alternator.jpg"}, {"name": "Démarreur", "file": "Automobile starter.JPG"}, {"name": "Batterie", "file": "Car battery.jpg"}, {"name": "Injecteur", "file": "Changing a fuel injector while performing maintenance on a car engine.jpg"}, {"name": "Turbo", "file": "Turbocharger.jpg"}, {"name": "Embrayage", "file": "Pull type clutch.jpg"}, {"name": "Disque de frein", "file": "Bremsscheibe PKW innenbelüftet, defekt wegen Rissen (Teelicht zum Größenvergleich).jpg"}, {"name": "Plaquette de frein", "file": "Automobile brake pad.jpg"}, {"name": "Filtre à air", "file": "Air filter (1570141562).jpg"}, {"name": "Pompe à eau", "file": "Pompa wody2.jpg"}, {"name": "Radiateur", "file": "Automobile radiator.jpg"}, {"name": "Amortisseur", "file": "Shock absorber.png"}, {"name": "Piston", "file": "Piston of DAT engine.jpg"}, {"name": "Arbre à cames", "file": "Ford-I4DOHC-camshafts.jpeg"}, {"name": "Bougie d'allumage", "file": "Spark plug.jpg"}];
const board=document.getElementById('board'), movesEl=document.getElementById('moves'), foundEl=document.getElementById('found'), win=document.getElementById('win');
let first=null,second=null,locked=false,moves=0,found=0;
function photo(file){
 return 'https://commons.wikimedia.org/wiki/Special:Redirect/file/'+encodeURIComponent(file);
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeCard(c,kind,i){
 const b=document.createElement('button');b.className='card';b.dataset.pair=i;
 const front=kind==='name'?'<div class="name">'+c.name+'</div>':'<img src="'+photo(c.file)+'" alt="'+c.name+'" onerror="this.style.display=\'none\';this.parentElement.innerHTML=\'<div class=\\\'name\\\'>Photo indisponible</div>\'">';
 b.innerHTML='<div class="inner"><div class="face back">🔧</div><div class="face front">'+front+'</div></div>';
 b.onclick=()=>flip(b);return b;
}
function flip(c){
 if(locked||c===first||c.classList.contains('done'))return;
 c.classList.add('open');
 if(!first){first=c;return}
 second=c;locked=true;moves++;movesEl.textContent=moves;
 if(first.dataset.pair===second.dataset.pair){
  first.classList.add('done');second.classList.add('done');found++;foundEl.textContent=found;
  first=second=null;locked=false;if(found===parts.length)win.style.display='block';
 }else setTimeout(()=>{first.classList.remove('open');second.classList.remove('open');first=second=null;locked=false},850);
}
function start(){
 board.innerHTML='';moves=found=0;first=second=null;locked=false;movesEl.textContent=0;foundEl.textContent=0;win.style.display='none';
 let deck=[];parts.forEach((p,i)=>{deck.push([p,'name',i]);deck.push([p,'image',i])});
 shuffle(deck).forEach(x=>board.appendChild(makeCard(x[0],x[1],x[2])));
}
document.getElementById('new').onclick=start;start();
</script>
</body></html>
